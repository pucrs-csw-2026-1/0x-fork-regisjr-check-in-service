name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # @nestjs/testing@^11 x @nestjs/common@^10: mesma flag do Dockerfile.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check / build
        run: npm run build

      - name: Unit tests (com cobertura)
        run: npm run test:cov
